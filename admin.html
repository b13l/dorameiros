<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Dorameiros</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="admin-container">
    <h1>Painel Admin</h1>
    <form id="adminForm">
      <input type="text" id="uidInput" placeholder="UID do usuário" required>
      <select id="planoSelect">
        <option value="24h">24h - R$5</option>
        <option value="7d">7 dias - R$14</option>
        <option value="30d">30 dias - R$24,99</option>
        <option value="60d">60 dias - R$50,99</option>
        <option value="180d">180 dias - R$89,99</option>
        <option value="anual">Anual - R$159,90</option>
      </select>
      <button type="submit">Ativar assinatura</button>
    </form>
    <p id="msgAdmin" style="margin-top:1rem"></p>
    <button onclick="auth.signOut()">Sair</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
